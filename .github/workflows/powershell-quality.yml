name: PowerShell quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install PowerShell quality tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./src -Recurse -Severity Warning,Error
          $results | Format-Table -AutoSize
          if ($results) { throw 'PSScriptAnalyzer found warning or error findings.' }

      - name: Run Pester tests
        shell: pwsh
        run: |
          Invoke-Pester -Path ./tests -CI -Output Detailed
